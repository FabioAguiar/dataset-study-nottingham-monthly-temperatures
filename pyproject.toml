[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-study-nottingham-monthly-temperatures"
version = "0.1.0"
description = "Reproducible univariate forecasting study of the Nottingham monthly temperatures series"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "ucimlrepo>=0.0.7",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
]
test = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
